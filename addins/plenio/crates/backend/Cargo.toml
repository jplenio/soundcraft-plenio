[package]
name = "soundcraft-plenio-backend"
description = "Plenio add-in for SoundCraft: its settings, its ComfyUI instance, the Song API client and the model downloads"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[package.metadata.soundcraft]
# A service beside the engine; it depends on no SoundCraft crate.
layer = 4

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
log.workspace = true
# Already in the build (a file's SHA-256 for the release records sent to the player).
sha2 = "0.10"
# The features craft-update already uses, so no crate is added to the build.
ureq = { version = "3.4", default-features = false, features = ["rustls-no-provider", "_ring", "gzip", "platform-verifier"] }

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true
